[project]
name = "tramplin-mcp"
version = "0.1.0"
description = "Agent-friendly MCP server for Tramplin course authoring"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "starlette>=1.0.1",
]

[project.scripts]
tramplin-mcp = "tramplin_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramplin_mcp"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A",
    "C4", "DTZ", "T20", "SIM", "TID", "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
