apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tramplin-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-tramplin-mcp
    kind: SecretStore
  target:
    name: tramplin-mcp
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: TRAMPLIN_MCP_JWT_SIGNING_KEY
    remoteRef:
      key: TRAMPLIN_MCP_JWT_SIGNING_KEY
  - secretKey: TRAMPLIN_MCP_STORAGE_ENCRYPTION_KEY
    remoteRef:
      key: TRAMPLIN_MCP_STORAGE_ENCRYPTION_KEY
